name: Monitoramento

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # permite rodar manualmente

jobs:
  verificar-saude:
    name: Verificar se o sistema está no ar
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a rota /saude em produção
        run: |
          URL="https://gestao-distribuicao-cestas-basicas.onrender.com/saude"
          echo "Verificando $URL"
          # O plano gratuito do Render "dorme": tenta por até ~3 minutos antes de acusar queda
          for tentativa in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o resposta.json -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Tentativa $tentativa: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              cat resposta.json; echo
              echo "Sistema no ar."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Sistema fora do ar ou com falha no banco (último status: $STATUS)"
          exit 1
