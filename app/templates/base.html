<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gestão de Cestas Básicas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('main.index') }}">Gestão de Cestas Básicas</a></h1>
    <p>Programa Mãos Abertas — Remar Brasil</p>
    {% if session.get('id_voluntario') %}
    <form method="post" action="{{ url_for('main.logout') }}" class="sair">
      <span>Olá, {{ session.get('nome_voluntario') }}</span>
      <button type="submit">Sair</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <p class="alerta alerta-{{ categoria }}" role="alert">{{ mensagem }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
